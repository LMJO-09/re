<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div id="landing-page" class="flex flex-col items-center justify-center h-screen text-center p-6">
        <h1 class="text-5xl font-bold mb-4 text-emerald-400">مرحباً بك في منصتنا!</h1>
        <p class="text-xl text-gray-300 mb-8 max-w-lg">منصة تعليمية تفاعلية. ابدأ الآن وشارك أفكارك.</p>
        <button id="loginBtn" class="bg-emerald-600 px-8 py-3 rounded-full text-lg font-bold hover:bg-emerald-500 transition">ابدأ الآن</button>
    </div>

    <div id="app-page" class="hidden h-screen flex flex-col p-4 max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold mb-4 text-center">غرفة الدردشة</h2>
        <div id="chat-box" class="flex-1 bg-gray-800 rounded-lg p-4 mb-4 overflow-y-auto border border-gray-700"></div>
        <div class="flex gap-2">
            <input id="messageInput" class="flex-1 bg-gray-700 p-2 rounded text-white border border-gray-600" placeholder="اكتب رسالتك...">
            <button onclick="sendMessage()" class="bg-emerald-600 px-6 py-2 rounded font-bold">إرسال</button>
        </div>
    </div>

    <script>
        // إعدادات Supabase الخاصة بك
        const supabaseUrl = 'https://dasdzjhprksponuxnwap.supabase.co';
        const supabaseKey = 'sb_publishable_ZHnL1XC1Xhf5vvAswXTBRw_d3kuJLQj';
        
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        // زر تسجيل الدخول
        document.getElementById('loginBtn').addEventListener('click', async () => {
            await client.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
        });

        // مراقبة الدخول
        client.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('landing-page').classList.add('hidden');
                document.getElementById('app-page').classList.remove('hidden');
            }
        });

        // دالة الإرسال
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const { data: { user } } = await client.auth.getUser();
            if(!user || !input.value) return;

            await client.from('messages').insert({ content: input.value, user_id: user.id });
            input.value = '';
        }
    </script>
</body>
</html>
