<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <div id="landing-page" class="flex flex-col items-center justify-center h-screen text-center p-6">
        <h1 class="text-5xl font-bold mb-4 text-emerald-400">مرحباً بك في منصتنا!</h1>
        <p class="text-xl text-gray-300 mb-8 max-w-lg">نحن منصة تعليمية تفاعلية، نهتم بمشاركة الأفكار ودعم الطلاب. ابدأ الآن وانضم للمجتمع.</p>
        <button onclick="loginWithGoogle()" class="bg-emerald-600 px-8 py-3 rounded-full text-lg font-bold hover:bg-emerald-500 transition">ابدأ الآن</button>
    </div>

    <div id="app-page" class="hidden h-screen flex flex-col p-4">
        <h2 class="text-2xl font-bold mb-4">غرفة الدردشة العامة</h2>
        <div id="chat-box" class="flex-1 bg-gray-800 rounded-lg p-4 mb-4 overflow-y-auto"></div>
        <div class="flex gap-2">
            <input id="messageInput" class="flex-1 bg-gray-700 p-2 rounded" placeholder="اكتب رسالتك...">
            <button onclick="sendMessage()" class="bg-emerald-600 px-4 py-2 rounded">إرسال</button>
        </div>
    </div>

    <script>
        // 🔑 ضع بياناتك هنا
        const supabase = supabase.createClient('https://dasdzjhprksponuxnwap.supabase.co', 'sb_publishable_ZHnL1XC1Xhf5vvAswXTBRw_d3kuJLQj');

        async function loginWithGoogle() {
            await supabase.auth.signInWithOAuth({ provider: 'google' });
        }

        // التحقق من حالة الدخول
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('landing-page').classList.add('hidden');
                document.getElementById('app-page').classList.remove('hidden');
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const user = (await supabase.auth.getSession()).data.session.user;
            await supabase.from('messages').insert({ content: input.value, user_id: user.id });
            input.value = '';
        }
    </script>
</body>
</html>
