<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة إبداعك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white">

    <div id="landing-page" class="flex flex-col items-center justify-center h-screen text-center p-6">
        <h1 class="text-4xl font-bold mb-6 text-emerald-400">منصة إبداعك</h1>
        <button id="loginBtn" class="bg-emerald-600 px-8 py-3 rounded-xl font-bold">ابدأ رحلة الإبداع</button>
    </div>

    <div id="app-page" class="hidden container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-4">لوحة إبداعك</h2>
        <textarea id="postInput" class="w-full bg-slate-800 p-4 rounded-lg mb-4"></textarea>
        <button onclick="publishPost()" class="bg-emerald-600 px-6 py-2 rounded">نشر الفكرة</button>
        <div id="postsContainer" class="mt-6 space-y-2"></div>
    </div>

    <script>
        const client = supabase.createClient(
            'https://dasdzjhprksponuxnwap.supabase.co',
            'sb_publishable_ZHnL1XC1Xhf5vvAswXTBRw_d3kuJLQj'
        );

        // عند تحميل الصفحة، تأكد من تسجيل الدخول
        window.addEventListener('load', async () => {
            const { data } = await client.auth.getSession();
            if (data.session) {
                document.getElementById('landing-page').classList.add('hidden');
                document.getElementById('app-page').classList.remove('hidden');
            }
        });

        // زر تسجيل الدخول موجه للرابط الذي حددته
        document.getElementById('loginBtn').onclick = async () => {
            await client.auth.signInWithOAuth({ 
                provider: 'google', 
                options: { redirectTo: 'https://lmjo-09.github.io/re/' } 
            });
        };

        async function publishPost() {
            const input = document.getElementById('postInput');
            const { data: { user } } = await client.auth.getUser();
            await client.from('posts').insert({ content: input.value, user_id: user.id });
            input.value = '';
        }
    </script>
</body>
</html>
