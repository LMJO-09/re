<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إبداعك | التفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <div id="landing-page" class="flex flex-col items-center justify-center h-screen text-center p-6">
        <h1 class="text-6xl font-extrabold mb-6 text-emerald-400 animate-pulse">منصة إبداعك</h1>
        <p class="text-xl mb-8 max-w-lg text-slate-400">فضاءك الخاص للإبداع والمشاركة. تنتهي منشوراتك وتتجدد تلقائياً كل 48 ساعة!</p>
        <button id="loginBtn" class="bg-emerald-600 hover:bg-emerald-500 px-10 py-4 rounded-2xl text-xl font-bold transition-all shadow-lg shadow-emerald-900/50">ابدأ رحلة الإبداع الآن</button>
    </div>

    <div id="app-page" class="hidden container mx-auto p-6 max-w-3xl">
        <header class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold">لوحة إبداعك</h2>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">خروج</button>
        </header>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-8">
            <textarea id="postInput" class="w-full bg-slate-800 p-4 rounded-xl mb-4 border border-slate-700" placeholder="بماذا تبدع اليوم؟"></textarea>
            <button onclick="publishPost()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">نشر الفكرة</button>
        </div>

        <div id="postsContainer" class="space-y-4"></div>
    </div>

    <script>
        const client = supabase.createClient(
            'https://dasdzjhprksponuxnwap.supabase.co',
            'sb_publishable_ZHnL1XC1Xhf5vvAswXTBRw_d3kuJLQj'
        );

        // تسجيل الدخول
        document.getElementById('loginBtn').onclick = async () => {
            await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
        };

        // التحقق من حالة المستخدم
        client.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('landing-page').classList.add('hidden');
                document.getElementById('app-page').classList.remove('hidden');
                loadPosts();
            }
        });

        // النشر التلقائي مع تاريخ انتهاء (48 ساعة)
        async function publishPost() {
            const content = document.getElementById('postInput').value;
            const { data: { user } } = await client.auth.getUser();
            
            await client.from('posts').insert({
                content: content,
                user_id: user.id,
                expires_at: new Date(new Date().getTime() + 48*60*60*1000).toISOString()
            });
            document.getElementById('postInput').value = '';
            loadPosts();
        }

        async function loadPosts() {
            const { data } = await client.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('postsContainer');
            container.innerHTML = data.map(p => `<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">${p.content}</div>`).join('');
        }

        async function logout() { await client.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
